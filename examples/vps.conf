# agbox config for a public VPS. Run as root on a fresh server:
#   AGBOX_TAILSCALE_AUTHKEY=tskey-auth-... agbox setup --config examples/vps.conf --yes
# Creates user `dev` (with root's SSH keys), key-only SSH, firewall (SSH + Tailscale only).

AGBOX_PROFILE=vps
AGBOX_USER=dev
AGBOX_TIMEZONE=Etc/UTC

AGBOX_AGENTS="claude codex opencode"
AGBOX_MISE_TOOLS="node@lts python@3.13 uv pnpm bun"

# Small VPS: skip the ~400 MB of browser libraries if you don't do browser testing.
AGBOX_PLAYWRIGHT=false
