# agbox config for a mini PC / home server on a trusted network.
# Use: sudo agbox setup --config examples/homelab.conf   (or copy to /etc/agbox/agbox.conf)

AGBOX_PROFILE=homelab
AGBOX_HOSTNAME=home-server
AGBOX_TIMEZONE=Europe/Rome

AGBOX_AGENTS="claude codex"
AGBOX_AGENT_MODE=yolo
AGBOX_SERVICES="t3code"

# A second, bigger disk mounted at /home? Keep images and volumes there.
# AGBOX_DOCKER_DATA_ROOT=/home/docker

AGBOX_GIT_NAME="Your Name"
AGBOX_GIT_EMAIL="you@example.com"
